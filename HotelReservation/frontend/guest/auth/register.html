<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Đăng ký tài khoản khách tại Copy Paste Hotel."
    />
    <title>Đăng ký - Copy Paste Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Roboto:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <script src="../assets/js/guest-validation.js" defer></script>
    <script src="../assets/js/guest-session.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
  </head>
  <body class="auth-page auth-register">
    <main id="main" class="auth-main">
      <section class="auth-card" aria-labelledby="auth-title">
        <a class="auth-back" href="../index.html">← Về trang trước</a>
        <div class="auth-heading">
          <p class="eyebrow">BẮT ĐẦU HÀNH TRÌNH</p>
          <h1 id="auth-title">Đăng ký</h1>
          <p>
            Tạo tài khoản để chuẩn bị cho những kỳ nghỉ sắp tới cùng Copy Paste
            Hotel.
          </p>
        </div>
        <p class="auth-demo-note">Chế độ dùng thử giao diện, chưa xác thực tài khoản thật.</p>
        <p id="auth-error" class="auth-error" role="status" hidden></p>
        <form id="auth-form" class="room-search-form" aria-labelledby="auth-title" novalidate>
          <div class="auth-field auth-field-wide">
            <label for="full-name">Họ và tên</label
            ><input
              id="full-name"
              name="fullName"
              type="text"
              autocomplete="name"
            />
          </div>
          <div class="auth-field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
            />
          </div>
          <div class="auth-field">
            <label for="phone">Số điện thoại</label
            ><input id="phone" name="phone" type="tel" autocomplete="tel" />
          </div>
          <div class="auth-field">
            <label for="password">Mật khẩu</label>
            <div class="password-control">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
              /><button
                class="password-toggle"
                type="button"
                aria-label="Hiện mật khẩu"
                aria-controls="password"
              >
                <span class="password-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="auth-field">
            <label for="confirm-password">Xác nhận mật khẩu</label>
            <div class="password-control">
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
              /><button
                class="password-toggle"
                type="button"
                aria-label="Hiện mật khẩu"
                aria-controls="confirm-password"
              >
                <span class="password-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <button class="button button-primary auth-submit" type="submit">
            Tạo tài khoản
          </button>
        </form>
        <p class="auth-switch">
          Đã có tài khoản? <a class="auth-text-link" href="login.html">Đăng nhập</a>
        </p>
        <a class="auth-home" href="../index.html"><span aria-hidden="true">←</span> Về trang chủ</a>
      </section>
    </main>
  </body>
</html>
