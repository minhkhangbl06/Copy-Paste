<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Khôi phục mật khẩu Copy Paste Hotel."
    />
    <title>Đặt lại mật khẩu - Copy Paste Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Roboto:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <script src="../assets/js/guest-validation.js" defer></script>
    <script src="../assets/js/guest-session.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/password-recovery.js" defer></script>
  </head>
<body class="auth-page" data-recovery="reset">
<main class="auth-main" id="main"><section class="auth-card" aria-labelledby="auth-title">
<div class="auth-heading"><h1 id="auth-title">Đặt lại mật khẩu</h1><p>Nhập mật khẩu mới và xác nhận mật khẩu.</p></div>
<form id="auth-form" class="room-search-form" aria-labelledby="auth-title" novalidate>
<div class="auth-field"><label for="password">Mật khẩu mới</label><div class="password-control"><input id="password" name="password" type="password" autocomplete="new-password" aria-invalid="false" aria-describedby="password-error" placeholder="Nhập mật khẩu mới" /><button class="password-toggle" type="button" aria-controls="password" aria-label="Hiện mật khẩu"><span class="password-icon" aria-hidden="true"></span></button></div><p id="password-error" class="search-field-error" hidden></p></div><div class="auth-field"><label for="confirm-password">Xác nhận mật khẩu mới</label><div class="password-control"><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" aria-invalid="false" aria-describedby="confirm-password-error" placeholder="Nhập lại mật khẩu mới" /><button class="password-toggle" type="button" aria-controls="confirm-password" aria-label="Hiện mật khẩu"><span class="password-icon" aria-hidden="true"></span></button></div><p id="confirm-password-error" class="search-field-error" hidden></p></div>
<button class="button button-primary auth-submit" type="submit">Đặt lại mật khẩu</button>
</form>
<p id="recovery-feedback" class="recovery-feedback" role="status" aria-live="polite" hidden></p>
<a class="auth-back" data-recovery-link="login" href="login.html">← Về đăng nhập</a>

<a class="auth-home" href="../index.html">← Về trang chủ</a>
</section></main></body></html>
