<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Khôi phục mật khẩu Copy Paste Hotel."
    />
    <title>Quên mật khẩu? - Copy Paste Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Roboto:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <script src="../assets/js/guest-validation.js" defer></script>
    <script src="../assets/js/guest-session.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/password-recovery.js" defer></script>
  </head>
<body class="auth-page" data-recovery="forgot">
<main class="auth-main" id="main"><section class="auth-card" aria-labelledby="auth-title">
<div class="auth-heading"><h1 id="auth-title">Quên mật khẩu?</h1><p>Nhập email tài khoản để yêu cầu hướng dẫn đặt lại mật khẩu.</p></div>

<form id="auth-form" class="room-search-form" aria-labelledby="auth-title" novalidate>
<div class="auth-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" aria-invalid="false" aria-describedby="email-error" placeholder="Nhập email đã đăng ký" /><p id="email-error" class="search-field-error" hidden></p></div>
<button class="button button-primary auth-submit" type="submit">Gửi yêu cầu</button>
</form>
<p id="recovery-feedback" class="recovery-feedback" role="status" aria-live="polite" hidden></p>
<a class="auth-back" data-recovery-link="login" href="login.html">← Về đăng nhập</a>
<p class="auth-switch"><a class="auth-text-link" data-recovery-link="reset-password" href="reset-password.html">Đặt lại mật khẩu</a></p>
<a class="auth-home" href="../index.html">← Về trang chủ</a>
</section></main></body></html>
